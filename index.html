
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giphy GIF Finder</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
    <h1>Giphy GIF Finder</h1>
    <p>Find your favorite GIFs!</p>

    <form id="gif-form">
      <input id="api-key" type="password"
        placeholder="Enter your Giphy API key" required>

      <input id="search-input" type="text"
        placeholder="Search for GIFs" value="basketball" required>

      <button id="fetch-gif-btn" type="submit">Fetch GIFs</button>
    </form>

    <p id="status-message" role="status"></p>
    <div id="gif-container"></div>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
